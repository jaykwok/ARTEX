name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Go tests and vet (isolated SQLite fixtures)
        run: |
          export ARTEX_TEST_PYTHON="$(command -v python3)"
          go test ./... -count=1 -timeout 180s
          go vet ./...
          go mod verify
      - name: Go vulnerability gate
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Frontend checks and dependency gate
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm audit --audit-level=low
          npm run build:static
      - name: Release metadata tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Embedded binary and fresh SQLite smoke test
        run: |
          mkdir -p server/webui/dist
          cp -R web/out/. server/webui/dist/
          go build -tags embedui -o "$RUNNER_TEMP/artex" ./cmd/artex
          smoke_dir="$(mktemp -d)"
          export ARTEX_DB_PATH="$smoke_dir/artex.sqlite"
          "$RUNNER_TEMP/artex" -data "$smoke_dir/data" -addr 127.0.0.1:18787 -proxy '' > "$smoke_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" || true; cat "$smoke_dir/server.log"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail http://127.0.0.1:18787/api/health; then
              test -s "$ARTEX_DB_PATH"
              exit 0
            fi
            kill -0 "$server_pid" || exit 1
            sleep 1
          done
          exit 1
